services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salary_db
      POSTGRES_USER: salary_app
      POSTGRES_PASSWORD: salary_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_app -d salary_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

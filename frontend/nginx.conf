server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view - proxied to the backend container over the
    # Docker network. This is what takes CORS out of the picture entirely in the deployed stack
    # (see docs/tradeoffs.md's CORS note, which only applies to local dev on two different ports).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # Angular client-side routing: any path not matching a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<h2 mat-dialog-title>Record Salary Adjustment</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>New base salary</mat-label>
      <input matInput appNumericOnly formControlName="baseSalary" />
      @if (form.controls.baseSalary.hasError('required') && form.controls.baseSalary.touched) {
        <mat-error>Required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Currency</mat-label>
      <mat-select formControlName="currency">
        @for (currency of currencies; track currency) {
          <mat-option [value]="currency">{{ currency }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Effective date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="effectiveDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Reason</mat-label>
      <mat-select formControlName="reason">
        @for (reason of reasons; track reason) {
          <mat-option [value]="reason">{{ reason }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save</button>
  </mat-dialog-actions>
</form>

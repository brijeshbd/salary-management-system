databases:
  - name: salary-mgmt-db
    databaseName: salary_db
    user: salary_app
    plan: free

services:
  - type: web
    name: salary-mgmt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # "seed" is idempotent (skips if data already exists) - safe to leave active permanently,
      # so the deployed service self-seeds 10,000 employees on first boot with no manual step.
      - key: SPRING_PROFILES_ACTIVE
        value: prod,seed
      - key: DATABASE_URL
        fromDatabase:
          name: salary-mgmt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HR_ADMIN_EMAIL
        value: admin@acme.com
      - key: HR_ADMIN_PASSWORD
        generateValue: true
      # Best-guess based on the frontend service name below. If Render assigns a different
      # hostname (e.g. due to a name collision), update this in the Render dashboard after first
      # deploy - see docs/deployment.md.
      - key: CORS_ALLOWED_ORIGINS
        value: https://salary-mgmt-frontend.onrender.com

  - type: web
    name: salary-mgmt-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Same caveat as CORS_ALLOWED_ORIGINS above, mirrored - see docs/deployment.md.
      - key: BACKEND_URL
        value: https://salary-mgmt-backend.onrender.com
